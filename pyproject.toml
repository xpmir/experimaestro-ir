[project]
name = "experimaestro-ir"
requires-python = ">=3.11,<3.15"
keywords = ["neural information retrieval", "information retrieval", "experiments"]
description = "Experimaestro common module for IR experiments"
dynamic = ["version"]
readme = "README.md"
license = {text = "GPL-3"}
authors = [
    { name = "Benjamin Piwowarski",  email = "benjamin@piwowarski.fr" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Experimaestro
    "experimaestro>=2.7.0",
    "datamaestro>=0.2.3",
    "datamaestro-ir>=0.5.0",
    "docstring_parser",
    "impact-index>=1.9.3",
    "pandas",
    "scipy",
    "attrs",
    # Information retrieval libraries
    "ir-measures>=0.3.3",
    # Torch addons
    "toma",
    "pytorch-lightning",
    "xpm-torch>=0.3.0",
    "python-dotenv>=1.2.1",
    "pytest>=9.0.2",
    "pillow>=12.1.0",
    "transformers>=5.8.1",
]

[project.optional-dependencies]
anserini = [
    "pyserini >= 0.20.0"
]

neural = [
    "torch>=2.10",
    "tensorboard",
    "transformers",
    "sentence_transformers>=6.0.0"
]

fast-plaid = [
    "fast-plaid"
]

[dependency-groups]
documentation = [
    "Sphinx>6",
    "myst-parser",
    "mock",
    "sphinx-codeautolink>=0.15",
    "sphinx-toolbox",
    "sphinx-rtd-theme>=3",
    "sphobjinv"
]
test = [
    { include-group = "documentation" },
    "experimaestro-ir[neural]",
    "pytest",
    "faiss-cpu",
    "ruff>=0.14",
    "transformers",
]
dev = [
    "docutils>=0.21.2",
    "faiss-cpu>=1.13.2",
    "pytest>=8.4.1",
    "ruff>=0.14.14",
    "sphinx>=8.1.3",
    "sphobjinv>=2.3.1.3",
    { include-group = "release" },
]
# Release checks (uv-release-manager); installed alone by the publish workflow
release = [
    "uv-release-manager>=1,<2",
]

[project.urls]
homepage = "https://github.com/bpiwowar/experimaestro-ir"
documentation = "https://experimaestro-ir.readthedocs.io/en/latest/"
repository = "https://github.com/bpiwowar/experimaestro-ir"

[project.scripts]
xpmir = "xpmir.__main__:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/xpmir/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xpmir"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]

[tool.uv.sources]
# Temporary: documents' languages metadata (not released yet)
datamaestro-ir = { git = "https://github.com/xpmir/datamaestro_ir", branch = "main" }

[tool.pytest.ini_options]
markers = [
    "dependency: mark test dependencies (deselected when dependency fails)",
]
filterwarnings = [
    "ignore:.*frontend\\.OptionParser.*:DeprecationWarning",
    "ignore:.*frontend\\.Option.*:DeprecationWarning",
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:.*ambiguous default value:DeprecationWarning:experimaestro",
    "ignore:.*resources as decorators is deprecated:DeprecationWarning",
]

[tool.ruff]
# Exclude submodules — they have their own ruff config
exclude = ["datamaestro-text"]

[tool.pyright]
include = ["xpmir"]
